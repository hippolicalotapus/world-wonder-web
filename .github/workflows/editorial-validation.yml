name: Editorial record validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run editorial and public export regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
