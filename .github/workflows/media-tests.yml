name: Media catalog checks
on:
  pull_request:
    paths:
      - 'src/media-validation.cjs'
      - 'tests/media-*.test.cjs'
      - 'data/media-catalog.json'
      - '.github/workflows/media-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run media catalog tests
        run: node --test tests/media-*.test.cjs
